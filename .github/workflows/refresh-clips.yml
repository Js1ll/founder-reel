name: Refresh clips
on:
  schedule:
    - cron: '17 19 * * 1,4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find new clips
        run: node scripts/youtube-refresh.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Check the data
        run: node scripts/validate.mjs
      - name: Publish changes
        run: |
          git config user.name "founder-reel-bot"
          git config user.email "founder-reel-bot@users.noreply.github.com"
          git add data/clips.json data/candidates.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update clips"
            git push
          fi
